{% extends "admin_base.html" %}
{% block content %}
  <h1>{{ 'Изменить пользователя' if user else 'Добавить пользователя' }}</h1>
  <form method="post" class="vstack gap-3">
    {% include "_csrf.html" %}
    <div>
      <label class="form-label" for="username">Логин</label>
      <input type="text" class="form-control" id="username" name="username" value="{{ values.username or '' }}" maxlength="255" required>
    </div>
    {% if not user %}
      <div>
        <label class="form-label" for="password">Пароль</label>
        <input type="password" class="form-control" id="password" name="password" minlength="12" maxlength="256" autocomplete="new-password" required>
      </div>
    {% endif %}
    <div>
      <label class="form-label" for="full_name">Полное имя</label>
      <input type="text" class="form-control" id="full_name" name="full_name" value="{{ values.full_name or '' }}" maxlength="255" required>
    </div>
    <div>
      <label class="form-label" for="role">Роль</label>
      <select class="form-select" id="role" name="role" required>
        {% for key, label in (('User', 'Редактор'), ('Viewer', 'Пользователь'), ('Admin', 'Администратор')) %}
          <option value="{{ key }}" {% if values.role == key %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="form-label" for="areaid">Участок пользователя с ролью «Пользователь»</label>
      <select class="form-select" id="areaid" name="areaid">
        <option value="">Выберите участок</option>
        {% for area in areas %}
          <option value="{{ area.id }}" {% if values.areaid == area.id %}selected{% endif %}>{{ area.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn btn-primary align-self-start" type="submit">Сохранить</button>
  </form>
{% endblock %}
