name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-bookworm
        env:
          POSTGRES_USER: pli_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pli_test -d pli_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PLI_TEST_DSN: postgresql://pli_test:test-only-password@localhost:5432/pli_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: python -m pip install -r requirements.txt pytest==8.4.2 ruff==0.15.15 pip-audit==2.10.0
      - run: python -m pip check
      - run: ruff check .
      - run: python -m pytest
      - run: pip-audit --strict --no-deps -r requirements.txt
      - run: docker compose config --quiet
